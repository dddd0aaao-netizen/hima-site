<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق أهلنا - النجف والكوفة</title>
    <style>
        :root { --red: #e63946; --white: #ffffff; }
        body { background: var(--white); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* الهيدر وشريط البحث */
        header { background: var(--red); color: white; padding: 20px 10px; text-align: center; }
        .search-container { padding: 15px; background: #fff1f2; text-align: center; border-bottom: 1px solid #ffccd5; }
        #searchInput { width: 85%; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; text-align: center; }

        /* حاوية الكارتات */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: white; border-radius: 15px; overflow: hidden; border: 2px solid #f0f0f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .worker-name { background: var(--red); color: white; padding: 8px; font-weight: bold; }
        .details-btn { width: 100%; padding: 10px; border: none; background: white; color: var(--red); cursor: pointer; font-weight: bold; border-top: 1px solid #eee; }

        /* الزر العائم */
        .fab { position: fixed; bottom: 25px; left: 25px; background: var(--red); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(230,57,70,0.4); text-decoration: none; z-index: 1000; cursor: pointer; }

        /* النافذة */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: white; margin: 15% auto; padding: 25px; width: 80%; border-radius: 20px; text-align: center; border-top: 8px solid var(--red); }
        .wa-btn { background: #25D366; color: white; padding: 12px 20px; border-radius: 30px; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <h1>سوق أهلنا الخيرية</h1>
    <p>دليل المهن في النجف والكوفة</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" onkeyup="searchWorker()" placeholder="ابحث عن اسم العامل أو المهنة...">
</div>

<div class="container" id="worker-list">
    <!-- مثال لعامل -->
    <div class="card worker-card">
        <img src="https://via.placeholder.com/160" alt="worker">
        <div class="worker-name">أبو علي السباك</div>
        <button class="details-btn" onclick="alert('المنطقة: النجف\nالهاتف: 0770XXXXXXX')">التفاصيل</button>
    </div>
</div>

<!-- زر الإضافة (المصلح) -->
<div class="fab" onclick="showPromo()">+</div>

<!-- نافذة الترويج (المجانية) -->
<div id="promoModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--red)">انشر عملك مجاناً</h2>
        <p>ساهم في عمل الخير وانشر مهنتك لخدمة أهلنا في النجف والكوفة بدون أي رسوم.</p>
        <p style="font-weight: bold;">أرسل معلوماتك وصورتك عبر الواتساب لتفعيل إعلانك فوراً</p>
        <a href="https://wa.me/964XXXXXXXXX?text=أريد نشر عملي في سوق أهلنا الخيرية" class="wa-btn">مراسلة الدعم (واتساب)</a>
        <br><br>
        <button onclick="closePromo()" style="background:#eee; border:none; padding:8px 15px; border-radius:10px; cursor:pointer;">إغلاق</button>
    </div>
</div>

<!-- نقطة دخول المطور (مخفية أعلى اليسار) -->
<div onclick="openAdmin()" style="position:fixed; top:0; left:0; width:30px; height:30px; z-index:9999; opacity:0;"></div>

<script>
    // كلمة السر مالتك
    const KEY = "1234012340@@";

    function showPromo() { document.getElementById('promoModal').style.display = 'block'; }
    function closePromo() { document.getElementById('promoModal').style.display = 'none'; }

    // ميزة البحثfunction searchWorker() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('worker-card');
        
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].innerText.toLowerCase();
            if (name.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    function openAdmin() {
        if (prompt("رمز المطورين:") === KEY) {
            alert("أهلاً حسين ومحمود، العدادات تعمل تلقائياً الآن.");
            // هنا تفتح لوحة التحكم مالتك اللي ضفناها سابقاً
        }
    }

    // إغلاق النافذة عند الضغط خارجها
    window.onclick = function(event) {
        if (event.target.className === 'modal') { closePromo(); }
    }
</script>

</body>
</html>
